baseURL: https://erictonger.github.io/

languageCode: bn
title: "Eric's Blog"


# Use Hugo modules to add theme
module:
  imports:
  - path: github.com/hugo-toha/toha/v4
  mounts:
  - source: static/files
    target: static/files
  - source: ./node_modules/flag-icon-css/flags
    target: static/flags
  - source: ./node_modules/@fontsource/mulish/files
    target: static/files
  - source: ./node_modules/katex/dist/fonts
    target: static/fonts

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    languageName: English
    weight: 1
  fr:
    languageName: Français
    weight: 2

# Force a locale to be use, really useful to develop the application ! Should be commented in production, the "weight" should rocks.
# DefaultContentLanguage: bn

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Enable global emoji support
enableEmoji: true



# Site parameters
params:
  background: "images/site/test.jpeg"
  # GitHub repo URL of your site
  gitRepo: https://github.com/erictonger/erictonger.github.io

  gitBranch: eric-blog-toha-style
  features:
    # Enable portfolio section
    portfolio:
      enable: true
    darkMode:
      enable: true

    # Enable blog posts
    blog:
      enable: true
      showAuthor: true

    # Enable Table of contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true
      on_card: true # enables tags in post cards
    readingTime:
      enable: true
    
    # Enable & configure "Notes" features
    # notes:
    #   enable: true

    blog:
      enable: true
      showAuthor: true # shows the author of post (defaults true)
      # Share post on different social media
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: true
        whatsapp: true
        email: true
        # tumblr: true
        # pocket: true
        # diaspora: true
        # mastodon: true


  # Configure footer
  footer:
    enable: true
    